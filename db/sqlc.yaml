version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries/tasks.sql"
    gen:
      go:
        package: "db"
        out: "../services/pipeline-go/internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
