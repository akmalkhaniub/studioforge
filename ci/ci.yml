name: StudioForge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go-pipeline:
    name: Go 1.26 Pipeline & Concurrency Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Verify Go Dependencies & Compile
        run: |
          cd services/pipeline-go
          go mod tidy
          go build -v -o bin/server ./cmd/server
      - name: Run Race Detector & Concurrency Tests
        run: |
          cd services/pipeline-go
          go test -race -v ./...

  test-typescript-monorepo:
    name: TypeScript 5.7 & Turborepo Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Verify GraphQL Schema CodeGen
        run: pnpm --filter @studioforge/graphql-codegen run codegen
      - name: Typecheck Workspace Packages
        run: pnpm run build
